<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ファイルの選び方の試し</title>
<style>
body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:24px;background:#f4f6f5;color:#1f2d2a;line-height:1.6}
h1{font-size:20px}
.row{background:#fff;border:1px solid #a3b4b1;border-radius:12px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
label.btn{display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid #a3b4b1;background:#fff;font-weight:700;font-size:16px}
code{font-size:12px;color:#555;word-break:break-all}
.out{margin-top:8px;font-size:14px;color:#0b6b55;min-height:1.6em}
</style></head><body>
<h1>MusicXMLを開くときの選び方の試し</h1>
<p>A〜D を1つずつ押して、(1) はじめに写真・カメラの項目が出るか、ファイルの画面がすぐ出るか、(2) ドライブが出るか、(3) .mxl が灰色にならずに選べるか、を見てください。選ぶと下に名前と中身の種類が出ます。</p>
<div id="list"></div>
<script>
const C=[
 ['A','application/octet-stream'],
 ['B','.mxl,.musicxml,.xml,application/zip,application/x-zip,application/vnd.recordare.musicxml,application/vnd.recordare.musicxml+xml,application/xml,text/xml'],
 ['C','.mxl,.musicxml,.xml,application/octet-stream'],
 ['D','（絞り込みなし＝いまの改223）'],
];
const L=document.getElementById('list');
for(const [k,a] of C){
  const d=document.createElement('div');d.className='row';
  const id='f'+k;
  d.innerHTML=`<label class="btn" for="${id}">${k}：ファイルを選ぶ</label> <code>accept = ${a}</code><input type="file" id="${id}" hidden><div class="out"></div>`;
  const inp=d.querySelector('input');if(k!=='D')inp.setAttribute('accept',a);
  inp.addEventListener('change',async()=>{const f=inp.files[0];const o=d.querySelector('.out');if(!f){o.textContent='選ばれませんでした';return}
    const b=new Uint8Array(await f.slice(0,2).arrayBuffer());
    o.textContent=`${k}：「${f.name}」${(f.size/1024).toFixed(1)}KB ・ ${b[0]===0x50&&b[1]===0x4b?'.mxl（圧縮）として読めます':'文字のファイル（.musicxml など）'}`;inp.value=''});
  L.appendChild(d);
}
</script>
</body></html>
